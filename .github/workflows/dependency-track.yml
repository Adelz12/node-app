name: Dependency-Track SBOM Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DTRACK_PROJECT_UUID: 12472b82-5172-45f7-a9ff-49442121a1ad

jobs:
  sbom-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json

      - name: Upload SBOM to Dependency-Track
        run: |
          python3 -c "
          import json, base64
          with open('sbom.json', 'rb') as f:
              bom_b64 = base64.b64encode(f.read()).decode()
          payload = {'project': '${{ env.DTRACK_PROJECT_UUID }}', 'bom': bom_b64}
          with open('payload.json', 'w') as f:
              json.dump(payload, f)
          " 2>/dev/null || python -c "
          import json, base64
          with open('sbom.json', 'rb') as f:
              bom_b64 = base64.b64encode(f.read()).decode()
          payload = {'project': '${{ env.DTRACK_PROJECT_UUID }}', 'bom': bom_b64}
          with open('payload.json', 'w') as f:
              json.dump(payload, f)
          "
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X "PUT" "${{ secrets.DTRACK_URL }}/api/v1/bom" \
            -H "X-Api-Key: ${{ secrets.DTRACK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @payload.json)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response body:"
          cat response.txt
          echo ""
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ Upload failed with status $HTTP_CODE"
            exit 1
          fi

      - name: Wait for analysis to complete
        run: sleep 20

      - name: Check for critical/high vulnerabilities
        run: |
          RESPONSE=$(curl -s -H "X-Api-Key: ${{ secrets.DTRACK_API_KEY }}" \
            "${{ secrets.DTRACK_URL }}/api/v1/metrics/project/${{ env.DTRACK_PROJECT_UUID }}/current")
          echo "Metrics response: $RESPONSE"
          CRITICAL=$(echo "$RESPONSE" | jq '.critical // 0')
          HIGH=$(echo "$RESPONSE" | jq '.high // 0')
          echo "Critical: $CRITICAL, High: $HIGH"
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ Build failed: Critical or High vulnerabilities found."
            exit 1
          fi
          echo "✅ No critical/high vulnerabilities found."
